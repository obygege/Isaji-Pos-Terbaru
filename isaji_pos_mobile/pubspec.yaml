name: isaji_pos_mobile
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.16.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  responsive_builder: ^0.7.1
  google_fonts: ^8.2.1
  flutter_dotenv: ^6.0.1
  print_bluetooth_thermal: ^1.2.1
  esc_pos_utils_plus: ^2.0.4
  intl: ^0.20.3
  uuid: ^4.5.1
  # Menangani koneksi & cetak ke printer USB (Android). Dipilih karena
  # masih aktif dirawat (beda dengan flutter_usb_printer yang sudah
  # tidak diupdate sejak 2022 dan berisiko gagal build di Gradle/AGP
  # modern bawaan Flutter versi baru).
  flutter_pos_printer_platform_image_3_sdt: ^1.2.24

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Mendaftarkan file rahasia .env agar bisa dibaca oleh sistem
  assets:
    - .env
    - assets/images/LOGO.png
